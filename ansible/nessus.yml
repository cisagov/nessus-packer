---
- name: Install Nessus and configure system for more ephemeral ports
  hosts: all
  become: true
  become_method: ansible.builtin.sudo
  tasks:
    - name: Configure number of ephemeral ports
      ansible.builtin.include_role:
        name: more_ephemeral_ports
    # The AWS CLI is required for the cloud-init job that configures
    # and initializes Nessus.
    - name: Install AWS CLI
      ansible.builtin.package:
        name:
          - awscli
    - name: Install Nessus
      ansible.builtin.include_role:
        name: nessus
      vars:
        nessus_package_bucket: "{{ build_bucket }}"
        nessus_version: 10.12.1
